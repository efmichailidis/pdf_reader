<!doctype html>
<html lang="el">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ευρετήριο</title>
<style>
  :root {
    --bg: #ffffff;
    --band: #F2EEE8;
    --ink: #2A231F;
    --muted: #7A706A;
    --line: #E4DED6;
    --accent: #E0531C;
    --accent-ink: #ffffff;
    --soft: #F4F0EA;
    --tag: #EEE9E2;
    --solid: #2A231F;
    --solid-ink: #ffffff;
    --disabled: #C9C1B9;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #1B1816; --band: #262220; --ink: #F2ECE6; --muted: #A89E96;
      --line: #38322D; --accent: #F0703C; --accent-ink: #1B1816; --soft: #26211E;
      --tag: #302A26; --solid: #F2ECE6; --solid-ink: #1B1816; --disabled: #5A524C;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1B1816; --band: #262220; --ink: #F2ECE6; --muted: #A89E96;
    --line: #38322D; --accent: #F0703C; --accent-ink: #1B1816; --soft: #26211E;
    --tag: #302A26; --solid: #F2ECE6; --solid-ink: #1B1816; --disabled: #5A524C;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans", "Helvetica Neue", Arial, sans-serif;
    font-size: 15px; line-height: 1.45;
  }
  button { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .band { background: var(--band); padding: 22px 16px; text-align: center; }
  .band h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.01em; }

  .wrap { max-width: 880px; margin: 0 auto; padding: 24px 20px 48px; }

  .popular h2 { font-size: 17px; margin: 0 0 12px; }
  .popular-row { display: flex; flex-wrap: wrap; gap: 10px; }
  .pop {
    display: inline-flex; align-items: center; gap: 10px; padding: 9px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--bg);
    text-decoration: none; color: var(--ink); font-weight: 600; font-size: 14px;
  }
  .pop:hover { border-color: var(--accent); }
  .pop .ico {
    width: 30px; height: 30px; border-radius: 6px; background: var(--soft);
    display: grid; place-items: center; color: var(--accent);
  }
  .pop .chev { color: var(--accent); margin-left: 6px; }

  .intro { margin: 30px 0 14px; }
  .intro p { margin: 0; }
  .intro small { color: var(--muted); font-size: 12px; }

  .search {
    display: flex; align-items: center; gap: 8px; border: 1px solid var(--line);
    border-radius: 6px; padding: 0 12px; max-width: 420px; background: var(--bg);
  }
  .search:focus-within { border-color: var(--accent); }
  .search input {
    border: 0; outline: 0; background: transparent; color: var(--ink);
    font: inherit; padding: 10px 0; width: 100%;
  }
  .search input::placeholder { color: var(--muted); }
  .search .clear { border: 0; background: none; cursor: pointer; color: var(--muted); padding: 4px; display: none; }
  .search.has-value .clear { display: block; }

  .modes { display: flex; gap: 8px; margin: 20px 0 16px; }
  .mode {
    border: 1px solid var(--line); background: var(--bg); border-radius: 999px;
    padding: 7px 16px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .mode[aria-pressed="true"] { background: var(--solid); color: var(--solid-ink); border-color: var(--solid); }

  .letters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 26px; }
  .letter {
    min-width: 32px; height: 32px; padding: 0 8px; border: 1px solid var(--line);
    background: var(--bg); border-radius: 4px; font-size: 13px; font-weight: 600; cursor: pointer;
  }
  .letter:hover:not(:disabled) { border-color: var(--accent); }
  .letter[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  .letter:disabled { color: var(--disabled); cursor: default; }

  .group + .group { margin-top: 32px; }
  .group-head {
    display: flex; justify-content: space-between; align-items: baseline;
    border-bottom: 2px solid var(--accent); padding-bottom: 8px; margin-bottom: 8px;
  }
  .group-head h3 { margin: 0; font-size: 18px; }
  .group-head span { color: var(--muted); font-size: 12px; }

  .list { border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .item + .item { border-top: 1px solid var(--line); }
  .row {
    width: 100%; display: flex; align-items: center; gap: 10px; text-align: left;
    background: var(--bg); border: 0; padding: 13px 14px; cursor: pointer;
  }
  .row:hover { background: var(--soft); }
  .row .t { flex: 1; font-weight: 600; font-size: 14px; }
  .tag {
    background: var(--tag); color: var(--muted); font-size: 11px; padding: 3px 8px;
    border-radius: 4px; white-space: nowrap;
  }
  .row .caret { color: var(--accent); transition: transform .15s ease; flex: none; }
  .row[aria-expanded="true"] .caret { transform: rotate(180deg); }

  .panel { padding: 0 14px 14px; }
  .card { background: var(--soft); border-radius: 6px; padding: 14px 16px; }
  .card .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; }
  .card .role { font-size: 13px; margin-top: 2px; }
  .card .name { font-weight: 700; font-size: 15px; margin: 2px 0 10px; }
  .card a {
    display: flex; align-items: center; gap: 8px; color: var(--accent);
    text-decoration: none; font-size: 13px; font-weight: 600; width: fit-content;
  }
  .card a + a { margin-top: 6px; }
  .card a:hover { text-decoration: underline; }
  .card .none { color: var(--muted); font-size: 13px; }

  .empty { padding: 28px 16px; text-align: center; color: var(--muted); border: 1px dashed var(--line); border-radius: 6px; }
  .notice { font-size: 12px; color: var(--muted); background: var(--soft); border-radius: 6px; padding: 8px 12px; margin-bottom: 16px; }

  @media (max-width: 560px) {
    .wrap { padding: 18px 14px 40px; }
    .pop { flex: 1 1 100%; justify-content: space-between; }
    .row { flex-wrap: wrap; }
    .row .t { flex-basis: calc(100% - 30px); }
    .tag { order: 3; }
  }
  @media (prefers-reduced-motion: reduce) { .row .caret { transition: none; } }
</style>
</head>
<body>

<header class="band"><h1>Ευρετήριο</h1></header>

<main class="wrap">
  <section class="popular" aria-labelledby="pop-h">
    <h2 id="pop-h">Τα πιο δημοφιλή</h2>
    <div class="popular-row" id="popular"></div>
  </section>

  <section class="intro">
    <p>Βρείτε ποιος είναι Υπεύθυνος για κάθε Θέμα.</p>
    <small id="totals">Φόρτωση…</small>
  </section>

  <div class="search" id="searchBox">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
    <input id="q" type="search" placeholder="Αναζήτηση Θέματος" aria-label="Αναζήτηση Θέματος" autocomplete="off">
    <button class="clear" id="clear" aria-label="Καθαρισμός αναζήτησης">✕</button>
  </div>

  <div class="modes" role="group" aria-label="Ταξινόμηση">
    <button class="mode" data-mode="alpha" aria-pressed="true">Αλφαβητικά Α–Ω</button>
    <button class="mode" data-mode="unit" aria-pressed="false">Ανά Ενότητα</button>
  </div>

  <nav class="letters" id="letters" aria-label="Επιλογή γράμματος"></nav>

  <div id="notice"></div>
  <div id="results" aria-live="polite"></div>
</main>

<script>
/* ------------------------------------------------------------------
   Ρυθμίσεις
   DATA_URL: το endpoint του integration server. Αναμενόμενο JSON:
   {
     "topics": [
       { "id": "t1", "title": "Άδειες Εργαζομένου", "unit": "Ανθρώπινου Δυναμικού",
         "custodian": { "role": "Υπεύθυνος Αδειών & Απουσιών", "name": "…",
                        "phone": "214 100 9356", "email": "…", "staffbaseUserId": "…" } }
     ]
   }
   PROFILE_URL: προαιρετικό template για link στο προφίλ Staffbase,
   π.χ. "https://app.example.gr/profile/{id}". Αν μείνει κενό, δεν εμφανίζεται.
------------------------------------------------------------------- */
const DATA_URL = '/api/evretirio';
const PROFILE_URL = '';

const POPULAR = [
  { label: 'Θεματολόγιο', href: '#', icon: 'list' },
  { label: 'Η Ιστορία μας', href: '#', icon: 'clock' },
  { label: 'Τα Προϊόντα μας', href: '#', icon: 'bag' }
];

/* ---------------- Δοκιμαστικά δεδομένα ---------------- */
const MOCK_PEOPLE = [
  { role: 'Υπεύθυνος Αδειών & Απουσιών', name: 'Κατερίνα Παναγιώτου', phone: '214 100 9356', email: 'k.panagiotou@example.gr' },
  { role: 'Υπεύθυνος Διασφάλισης Ποιότητας', name: 'Νίκος Αλεξίου', phone: '214 100 9120', email: 'n.alexiou@example.gr' },
  { role: 'Συντονιστής Δικτύου Καταστημάτων', name: 'Μαρία Δημητρίου', phone: '214 100 9402', email: 'm.dimitriou@example.gr' },
  { role: 'Προϊστάμενος Λογιστηρίου', name: 'Γιώργος Σταύρου', phone: '214 100 9011', email: 'g.stavrou@example.gr' },
  { role: 'Υπεύθυνος Υποστήριξης Χρηστών', name: 'Ελένη Κωνσταντίνου', phone: '214 100 9777', email: 'e.konstantinou@example.gr' },
  { role: 'Υπεύθυνος Αξιολόγησης Προσωπικού', name: 'Δημήτρης Ιωάννου', phone: '214 100 9360', email: 'd.ioannou@example.gr' },
  { role: 'Υπεύθυνη Εταιρικής Επικοινωνίας', name: 'Σοφία Γεωργίου', phone: '214 100 9550', email: 's.georgiou@example.gr' },
  { role: 'Υπεύθυνος Αποθήκης', name: 'Παναγιώτης Μάρκου', phone: '214 100 9633', email: 'p.markou@example.gr' },
  { role: 'Νομικός Σύμβουλος', name: 'Αθηνά Λαμπροπούλου', phone: '214 100 9205', email: 'a.lampropoulou@example.gr' },
  { role: 'Υπεύθυνος Εγκαταστάσεων', name: 'Στέλιος Παπαδάκης', phone: '214 100 9888', email: 's.papadakis@example.gr' },
  { role: 'Υπεύθυνη Εκπαίδευσης', name: 'Ιωάννα Χριστοδούλου', phone: '214 100 9310', email: 'i.christodoulou@example.gr' },
  { role: 'Υπεύθυνος Προμηθειών', name: 'Κώστας Βασιλείου', phone: '214 100 9144', email: 'k.vasileiou@example.gr' }
];
const MOCK_TOPICS = [
  ['Αγορανομικές Σημάνσεις', 'Διαχείρισης Ποιότητας', 1],
  ['Άδειες Εργαζομένου', 'Ανθρώπινου Δυναμικού', 0],
  ['Αιτήματα - Σχόλια Πελατών', 'Δικτύου', 2],
  ['Αλλαντικά', 'Δικτύου', 2],
  ['Ανακύκλωση', 'Διαχείρισης Ποιότητας', 1],
  ['Αξιολόγηση', 'Ανθρώπινου Δυναμικού', 5],
  ['Απογραφή', 'Οικονομικά', 3],
  ['Αποθήκη Καταστήματος', 'Εφοδιαστικής Αλυσίδας', 7],
  ['Βάρδιες', 'Ανθρώπινου Δυναμικού', 0],
  ['Βεβαιώσεις Αποδοχών', 'Ανθρώπινου Δυναμικού', 0],
  ['Γραφική Ύλη', 'Προμηθειών', 11],
  ['Γραμματοσειρές & Λογότυπο', 'Εταιρικής Επικοινωνίας', 6],
  ['Δίκτυο Wi-Fi Καταστημάτων', 'Πληροφορικής', 4],
  ['Δελτία Τύπου', 'Εταιρικής Επικοινωνίας', 6],
  ['Ενδοεταιρικές Μεταφορές', 'Εφοδιαστικής Αλυσίδας', 7],
  ['Εκπαιδευτικά Προγράμματα', 'Εκπαίδευσης', 10],
  ['Ζημιές Εμπορευμάτων', 'Διαχείρισης Ποιότητας', 1],
  ['Ημερομηνίες Λήξης', 'Διαχείρισης Ποιότητας', 1],
  ['Θέρμανση - Κλιματισμός', 'Τεχνικών Υπηρεσιών', 9],
  ['Ιατρός Εργασίας', 'Ανθρώπινου Δυναμικού', 5],
  ['Κάρτα Εργαζομένου', 'Ανθρώπινου Δυναμικού', 0],
  ['Κωδικοί Πρόσβασης', 'Πληροφορικής', 4],
  ['Λογαριασμοί Ρεύματος', 'Οικονομικά', 3],
  ['Μισθοδοσία', 'Οικονομικά', 3],
  ['Μεταθέσεις Προσωπικού', 'Ανθρώπινου Δυναμικού', 5],
  ['Νομικά Θέματα Καταστημάτων', 'Νομικών Υπηρεσιών', 8],
  ['Οπωροκηπευτικά', 'Δικτύου', 2],
  ['Ομοιόμορφα Εργαζομένων', 'Προμηθειών', 11],
  ['Πυρασφάλεια', 'Τεχνικών Υπηρεσιών', 9],
  ['Προσφορές Φυλλαδίου', 'Εμπορικής Διεύθυνσης', 6],
  ['Συμβάσεις Προμηθευτών', 'Νομικών Υπηρεσιών', 8],
  ['Σεμινάρια Υγιεινής', 'Εκπαίδευσης', 10],
  ['Ταμειακές Μηχανές', 'Πληροφορικής', 4],
  ['Τεχνικές Βλάβες', 'Τεχνικών Υπηρεσιών', 9],
  ['Υπερωρίες', 'Ανθρώπινου Δυναμικού', 0],
  ['Φορτοεκφορτώσεις', 'Εφοδιαστικής Αλυσίδας', 7],
  ['Χρηματαποστολές', 'Οικονομικά', 3],
  ['Ψυγεία - Καταψύκτες', 'Τεχνικών Υπηρεσιών', 9],
  ['Ωράριο Καταστημάτων', 'Δικτύου', 2],
  ['SAP - Πρόσβαση Χρηστών', 'Πληροφορικής', 4],
  ['Staffbase - Εφαρμογή Εργαζομένων', 'Εταιρικής Επικοινωνίας', 6]
];
const MOCK = {
  topics: MOCK_TOPICS.map(([title, unit, p], i) => ({
    id: 't' + (i + 1), title, unit, custodian: { ...MOCK_PEOPLE[p], staffbaseUserId: 'mock-' + p }
  }))
};

/* ---------------- Βοηθητικά ---------------- */
const GREEK = ['Α','Β','Γ','Δ','Ε','Ζ','Η','Θ','Ι','Κ','Λ','Μ','Ν','Ξ','Ο','Π','Ρ','Σ','Τ','Υ','Φ','Χ','Ψ','Ω'];
const LATIN = 'A–Z';
const LETTERS = [...GREEK, LATIN];

const strip = s => (s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
const norm = s => strip(s).toLowerCase().replace(/ς/g, 'σ');
const collator = new Intl.Collator('el', { sensitivity: 'base', numeric: true });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));

function letterOf(title) {
  const c = strip(title).trim().charAt(0).toUpperCase();
  if (GREEK.includes(c)) return c;
  return LATIN;
}

const ICONS = {
  list: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 6h14M5 12h14M5 18h14"/></svg>',
  clock: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>',
  bag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 8h14l-1 12H6L5 8Z"/><path d="M9 8V6a3 3 0 0 1 6 0v2"/></svg>',
  phone: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"/></svg>',
  mail: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>',
  user: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
  caret: '<svg class="caret" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>'
};

/* ---------------- State ---------------- */
const state = { topics: [], mode: 'alpha', letter: 'Α', q: '', open: new Set() };
const $ = id => document.getElementById(id);

/* ---------------- Render ---------------- */
function renderPopular() {
  $('popular').innerHTML = POPULAR.map(p => `
    <a class="pop" href="${esc(p.href)}">
      <span class="ico">${ICONS[p.icon] || ''}</span>${esc(p.label)}
      <span class="chev" aria-hidden="true">›</span>
    </a>`).join('');
}

function renderTotals() {
  const units = new Set(state.topics.map(t => t.unit).filter(Boolean));
  $('totals').textContent = `${state.topics.length} Θέματα · ${units.size} Ενότητες`;
}

function renderLetters() {
  const box = $('letters');
  box.hidden = state.mode !== 'alpha' || !!state.q;
  if (box.hidden) return;
  const counts = {};
  state.topics.forEach(t => { counts[t._letter] = (counts[t._letter] || 0) + 1; });
  box.innerHTML = LETTERS.map(l => `
    <button class="letter" data-letter="${l}" aria-pressed="${l === state.letter}"
      ${counts[l] ? '' : 'disabled'} aria-label="${l === LATIN ? 'Λατινικοί χαρακτήρες' : 'Γράμμα ' + l}">${l}</button>`).join('');
}

function itemHTML(t) {
  const c = t.custodian || {};
  const open = state.open.has(t.id);
  const tel = (c.phone || '').replace(/[^\d+]/g, '');
  const profile = PROFILE_URL && c.staffbaseUserId ? PROFILE_URL.replace('{id}', encodeURIComponent(c.staffbaseUserId)) : '';
  const contact = [
    c.phone ? `<a href="tel:${esc(tel)}">${ICONS.phone}${esc(c.phone)}</a>` : '',
    c.email ? `<a href="mailto:${esc(c.email)}">${ICONS.mail}${esc(c.email)}</a>` : '',
    profile ? `<a href="${esc(profile)}" target="_top">${ICONS.user}Προφίλ στη Staffbase</a>` : ''
  ].join('');
  return `
    <div class="item">
      <button class="row" data-id="${esc(t.id)}" aria-expanded="${open}" aria-controls="p-${esc(t.id)}">
        <span class="t">${esc(t.title)}</span>
        ${t.unit ? `<span class="tag">${esc(t.unit)}</span>` : ''}
        ${ICONS.caret}
      </button>
      <div class="panel" id="p-${esc(t.id)}" ${open ? '' : 'hidden'}>
        <div class="card">
          ${c.name ? `
            <div class="lbl">Θεματοφύλακας</div>
            ${c.role ? `<div class="role">${esc(c.role)}</div>` : ''}
            <div class="name">${esc(c.name)}</div>
            ${contact}` : '<div class="none">Δεν έχει οριστεί Θεματοφύλακας για αυτό το Θέμα.</div>'}
        </div>
      </div>
    </div>`;
}

function groupHTML(title, items) {
  return `
    <section class="group">
      <div class="group-head"><h3>${esc(title)}</h3><span>${items.length} ${items.length === 1 ? 'Θέμα' : 'Θέματα'}</span></div>
      ${items.length ? `<div class="list">${items.map(itemHTML).join('')}</div>` : ''}
    </section>`;
}

function renderResults() {
  const out = $('results');
  const byTitle = (a, b) => collator.compare(a.title, b.title);

  if (state.q) {
    const q = norm(state.q);
    const hits = state.topics.filter(t => t._search.includes(q)).sort(byTitle);
    out.innerHTML = hits.length
      ? groupHTML(`Αποτελέσματα για «${state.q}»`, hits)
      : `<div class="empty">Κανένα Θέμα δεν ταιριάζει με «${esc(state.q)}». Δοκιμάστε λιγότερους χαρακτήρες ή το όνομα του υπευθύνου.</div>`;
    return;
  }

  if (state.mode === 'unit') {
    const groups = {};
    state.topics.forEach(t => (groups[t.unit || 'Χωρίς Ενότητα'] ||= []).push(t));
    out.innerHTML = Object.keys(groups).sort(collator.compare)
      .map(u => groupHTML(u, groups[u].sort(byTitle))).join('');
    return;
  }

  const items = state.topics.filter(t => t._letter === state.letter).sort(byTitle);
  out.innerHTML = items.length
    ? groupHTML(state.letter, items)
    : `<div class="empty">Δεν υπάρχουν Θέματα με «${esc(state.letter)}».</div>`;
}

function render() { renderLetters(); renderResults(); }

/* ---------------- Events ---------------- */
$('results').addEventListener('click', e => {
  const btn = e.target.closest('.row');
  if (!btn) return;
  const id = btn.dataset.id;
  const open = btn.getAttribute('aria-expanded') !== 'true';
  btn.setAttribute('aria-expanded', open);
  document.getElementById('p-' + id).hidden = !open;
  open ? state.open.add(id) : state.open.delete(id);
});

$('letters').addEventListener('click', e => {
  const b = e.target.closest('.letter');
  if (!b || b.disabled) return;
  state.letter = b.dataset.letter;
  render();
});

document.querySelectorAll('.mode').forEach(b => b.addEventListener('click', () => {
  state.mode = b.dataset.mode;
  document.querySelectorAll('.mode').forEach(x => x.setAttribute('aria-pressed', x === b));
  render();
}));

let timer;
$('q').addEventListener('input', e => {
  clearTimeout(timer);
  $('searchBox').classList.toggle('has-value', !!e.target.value);
  timer = setTimeout(() => { state.q = e.target.value.trim(); render(); }, 120);
});
$('clear').addEventListener('click', () => {
  $('q').value = ''; state.q = '';
  $('searchBox').classList.remove('has-value');
  $('q').focus(); render();
});

/* ---------------- Load ---------------- */
function prepare(data) {
  state.topics = (data.topics || []).map(t => ({
    ...t,
    _letter: letterOf(t.title),
    _search: norm([t.title, t.unit, t.custodian?.role, t.custodian?.name].join(' '))
  }));
  const counts = new Set(state.topics.map(t => t._letter));
  if (!counts.has(state.letter)) state.letter = LETTERS.find(l => counts.has(l)) || 'Α';
}

async function load() {
  renderPopular();
  try {
    const res = await fetch(DATA_URL, { credentials: 'include', headers: { Accept: 'application/json' } });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    prepare(await res.json());
  } catch (err) {
    console.warn('Ευρετήριο: χρήση δοκιμαστικών δεδομένων', err);
    prepare(MOCK);
    $('notice').innerHTML = '<div class="notice">Εμφανίζονται δοκιμαστικά δεδομένα, επειδή το ' + esc(DATA_URL) + ' δεν απάντησε.</div>';
  }
  renderTotals();
  render();
}
load();
</script>
</body>
</html>
