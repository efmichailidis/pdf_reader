<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<!-- Container με μέγιστο πλάτος και κεντράρισμα -->
<div id="pdf-container" style="width: 100%; max-width: 900px; margin: 0 auto;"></div>

<script>
  pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

  const url = '/assets/chart.pdf';
  const container = document.getElementById('pdf-container');
  let pdfDoc = null;

  async function renderAllPages() {
    if (!pdfDoc) return;

    // Καθαρισμός του container πριν το σχεδιασμό (π.χ. σε περίπτωση resize)
    container.innerHTML = '';

    // Υπολογισμός του διαθέσιμου πλάτους του container
    const containerWidth = container.clientWidth;

    for (let pageNum = 1; pageNum <= pdfDoc.numPages; pageNum++) {
      const page = await pdfDoc.getPage(pageNum);

      // Παίρνουμε το αρχικό viewport για να βρούμε το φυσικό πλάτος της σελίδας
      const unscaledViewport = page.getViewport({ scale: 1 });
      
      // Υπολογίζουμε το scale ώστε να χωράει ακριβώς στο πλάτος του container
      const scale = containerWidth / unscaledViewport.width;
      const viewport = page.getViewport({ scale: scale });

      const canvas = document.createElement('canvas');
      canvas.style.display = 'block';
      canvas.style.marginBottom = '20px';
      canvas.style.boxShadow = '0 4px 8px rgba(0,0,0,0.1)';
      canvas.style.width = '100%'; // Διασφαλίζει ότι δεν θα ξεπεράσει το container

      const context = canvas.getContext('2d');
      canvas.height = viewport.height;
      canvas.width = viewport.width;

      container.appendChild(canvas);

      await page.render({ canvasContext: context, viewport: viewport }).promise;
    }
  }

  // Αρχική φόρτωση του PDF
  pdfjsLib.getDocument(url).promise.then(pdf => {
    pdfDoc = pdf;
    renderAllPages();
  }).catch(err => {
    console.error('Σφάλμα φόρτωσης PDF:', err);
  });

  // Αυτόματος επανασχεδιασμός όταν αλλάζει το μέγεθος της οθόνης (με debounce για απόδοση)
  let resizeTimeout;
  window.addEventListener('resize', () => {
    clearTimeout(resizeTimeout);
    resizeTimeout = setTimeout(() => {
      renderAllPages();
    }, 300); // Περιμένει 300ms αφού σταματήσει το resize
  });
</script>
