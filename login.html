<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Login - Διαχείριση PDF</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
    .login-card { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 350px; }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; border-radius: 4px; border: 1px solid #ccc; }
    button { background: #007bff; color: white; font-weight: bold; border: none; cursor: pointer; margin-top: 15px; }
    button:hover { background: #0056b3; }
    #error { color: red; margin-top: 10px; text-align: center; }
  </style>
</head>
<body>

  <div class="login-card">
    <h2>🔒 Σύνδεση Διαχειριστή</h2>
    <form id="login-form">
      <input type="text" id="username" placeholder="Username" required />
      <input type="password" id="password" placeholder="Password" required />
      <button type="submit">Είσοδος</button>
    </form>
    <div id="error"></div>
  </div>

  <script>
    const form = document.getElementById('login-form');
    const errorDiv = document.getElementById('error');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorDiv.textContent = '';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        const response = await fetch('/api/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username, password }),
        });

        const data = await response.json();

        if (response.ok) {
          // Ανακατεύθυνση στη σελίδα διαχείρισης
          window.location.href = '/admin.html';
        } else {
          errorDiv.textContent = data.error || 'Σφάλμα σύνδεσης.';
        }
      } catch (err) {
        errorDiv.textContent = 'Αδυναμία επικοινωνίας με τον server.';
      }
    });
  </script>

</body>
</html>
