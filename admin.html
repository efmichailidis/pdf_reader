<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Διαχείριση PDF</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; padding: 40px; }
    .card { background: white; padding: 30px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    button { background: #28a745; color: white; border: none; padding: 10px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    button:hover { background: #218838; }
    #status { margin-top: 15px; font-weight: bold; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Συντήρηση / Ενημέρωση PDF</h2>
    <p>Ανεβάστε το νέο αρχείο PDF για να αντικαταστήσετε το υπάρχον στην αρχική σελίδα.</p>

    <form id="upload-form">
      <input type="file" id="pdf-file" accept="application/pdf" required /><br><br>
      <button type="submit">Αποστολή & Αντικατάσταση</button>
    </form>

    <div id="status"></div>
    <br>
    <a href="/index.html" target="_blank">🔍 Προβολή Αρχικής Σελίδας</a>
  </div>

  <script>
    const form = document.getElementById('upload-form');
    const statusDiv = document.getElementById('status');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const fileInput = document.getElementById('pdf-file');
      const file = fileInput.files[0];
      if (!file) return;

      statusDiv.style.color = 'black';
      statusDiv.textContent = 'Ενημέρωση GitHub repository...';

      try {
        const response = await fetch('/api/upload', {
          method: 'POST',
          body: file, // Στέλνουμε το raw PDF file
        });

        const data = await response.json();

        if (response.ok) {
          statusDiv.style.color = 'green';
          statusDiv.textContent = '✅ ' + data.message;
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        statusDiv.style.color = 'red';
        statusDiv.textContent = '❌ Σφάλμα: ' + err.message;
      }
    });

  </script>

</body>
</html>
