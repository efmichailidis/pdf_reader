<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8">
  <title>Διαχείριση PDF</title>
  <style>
    body { font-family: Arial, sans-serif; background: #eef2f5; padding: 30px; }
    .card { background: white; padding: 25px; border-radius: 8px; max-width: 500px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    input, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
    button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
    #result { margin-top: 15px; word-break: break-all; }
  </style>
</head>
<body>

  <div class="card">
    <h2>Διαχείριση PDF Documents</h2>
    
    <form id="pdf-form">
      <label>
        <strong>ID Εγγράφου (Αφήστε το κενό για ΝΕΟ έγγραφο):</strong>
        <input type="text" id="pdf-id" placeholder="π.χ. doc-171112233" />
      </label>

      <br><br>

      <label>
        <strong>Επιλέξτε Αρχείο PDF:</strong>
        <input type="file" id="pdf-file" accept="application/pdf" required />
      </label>

      <button type="submit">Αποστολή / Ενημέρωση</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById('pdf-form');
    const resultDiv = document.getElementById('result');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const fileInput = document.getElementById('pdf-file');
      const docIdInput = document.getElementById('pdf-id').value.trim();
      const file = fileInput.files[0];

      if (!file) return;

      resultDiv.innerHTML = '⏳ Αποστολή στο GitHub...';

      const headers = {};
      if (docIdInput) {
        headers['x-pdf-id'] = docIdInput; // Στέλνουμε το ID αν πρόκειται για update
      }

      try {
        const response = await fetch('/api/manage-pdf', {
          method: 'POST',
          headers: headers,
          body: file,
        });

        const data = await response.json();

        if (response.ok) {
          resultDiv.innerHTML = `
            <p style="color:green;">✅ ${data.message}</p>
            <p><strong>ID Εγγράφου:</strong> ${data.id}</p>
            <p><strong>URL Προβολής:</strong> <a href="${data.url}" target="_blank">${data.url}</a></p>
          `;
          form.reset();
        } else {
          throw new Error(data.error);
        }
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red;">❌ Σφάλμα: ${err.message}</p>`;
      }
    });
  </script>

</body>
</html>
